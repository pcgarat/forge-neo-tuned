# sd-webui-forge-neo: WebUI + API en puerto 7860
# Árbol único: DATA_PATH → /data (models, output, config, extensions/).
# Por defecto /workspace/forge-data (mismo layout que RunPod).
# Requiere: Docker con NVIDIA Container Toolkit.
# Si deploy.reservations no funciona, descomenta en el servicio: runtime: nvidia

services:
  forge-neo:
    build: .
    image: ${FORGE_IMAGE:-forge-neo:latest}
    container_name: forge-neo
    restart: unless-stopped
    # Arranca como root solo para el entrypoint (chown + setpriv → PUID:PGID).
    # Ajusta PUID/PGID en .env (`id -u` / `id -g`) para que output/ no sea root:root.
    env_file: .env
    ports:
      - "7860:7860"
    volumes:
      - ${DATA_PATH:-/workspace/forge-data}:/data
      - ${EXTENSIONS_PATH:-/workspace/forge-data/extensions}:/data/extensions
      # Desarrollo local de sd-forge-img2prompt (repo hermano; override sobre EXTENSIONS_PATH).
      - ${IMG2PROMPT_EXT_PATH:-../sd-forge-img2prompt}:/data/extensions/sd-forge-img2prompt
      # Entrypoint con drop de privilegios (sin rebuild de imagen).
      - ./entrypoint.sh:/entrypoint.sh:ro
    environment:
      - DATA_DIR=/data
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VIDEO_GID=${VIDEO_GID:-44}
      - RENDER_GID=${RENDER_GID:-992}
      - COMMANDLINE_ARGS=--listen --port 7860 --data-dir /data --model-ref /data/${MODELS_SUBDIR:-models} --ckpt-dirs /data/${MODELS_SUBDIR:-models}/${CHECKPOINT_SUBDIR:-Stable-diffusion} --text-encoder-dirs /data/${MODELS_SUBDIR:-models}/${TEXT_ENCODER_SUBDIR:-text_encoder} --gradio-allowed-path /app/webui --gradio-allowed-path /data --agent-scheduler-sqlite-file /data/task_scheduler.sqlite3 --enable-insecure-extension-access --skip-prepare-environment --skip-install --api
      # Pisa env_file: así `make klein9b` / `make chatbot` pueden inyectar EXTRA_ARGS.
      - EXTRA_ARGS=${EXTRA_ARGS:-}
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
